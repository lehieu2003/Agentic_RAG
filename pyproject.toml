[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Document Q&A Assistant - Chatbot hỏi đáp tài liệu kỹ thuật"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=2.6.0",
    "qdrant-client>=1.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "openai>=1.20.0",
    "python-docx>=1.1.0",
    "langgraph>=0.2.0",
    "rank-bm25>=0.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Generated protobuf stubs are not hand-maintained.
extend-exclude = ["src/rpc/retrieval_pb2_grpc.py", "src/rpc/retrieval_pb2.py"]

[tool.ruff.lint]
# Keep CI focused on real defects (errors, unused/undefined names); broader
# style sweeps can be enabled incrementally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts and test bootstrap import after configuring environment/sys.path.
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]
"src/rpc/__init__.py" = ["E402"]
"tests/*" = ["E731"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


