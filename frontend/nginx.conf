server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend API (service name on the compose network).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must stay at or above the backend MAX_UPLOAD_MB default (50 MB).
        client_max_body_size 64m;
        # A /query runs 4-6 sequential LLM calls plus CPU reranking — measured
        # ~75 s on the free Gemini tier. nginx's 60 s default returns 504 first.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
